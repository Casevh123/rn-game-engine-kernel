name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify kernel and demo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check kernel
        run: npm exec --workspace=@engine/kernel -- tsc --noEmit

      - name: Test kernel
        run: npm test --workspace=@engine/kernel -- --runInBand

      - name: Type-check Expo demo
        run: npm exec --workspace=apps/demo -- tsc --noEmit
